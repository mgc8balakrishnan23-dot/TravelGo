<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>TravelGo | Book your trip</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css"></head><body><div id="siteNav"></div><header class="page-hero slim"><span class="eyebrow light">ONE STEP CLOSER</span><h1>Let's make it official.</h1><p>Review your trip and add traveller details.</p></header><main class="container section-space"><div class="row g-4 justify-content-center"><div class="col-lg-7"><form id="bookingForm" class="booking-form"><h3>Traveller details</h3><div class="row g-3"><div class="col-md-6"><label>Full name</label><input id="travellerName" class="form-control" required></div><div class="col-md-6"><label>Email</label><input id="travellerEmail" type="email" class="form-control" required></div><div class="col-md-6"><label>Phone number</label><input id="travellerPhone" type="tel" pattern="[0-9+() -]{8,}" class="form-control" required></div><div class="col-md-6"><label>Number of travellers</label><input id="travellerCount" type="number" min="1" max="20" value="1" class="form-control" required></div><div class="col-md-6"><label>Travel date</label><input id="bookingDate" type="date" class="form-control" required></div><div class="col-md-6"><label>Special requests (optional)</label><input id="specialRequests" class="form-control" placeholder="Any preferences?"></div></div><div class="form-check mt-4"><input class="form-check-input" type="checkbox" id="termsCheck" required><label class="form-check-label" for="termsCheck">I confirm these details are correct.</label></div><button class="btn btn-primary w-100 mt-4">Confirm booking <i class="bi bi-arrow-right"></i></button><p class="tiny-note mt-3">This is a front-end demo. No real ticket, hotel reservation or payment is issued.</p></form></div><div class="col-lg-4"><aside class="booking-summary"><span class="section-kicker">YOUR SELECTION</span><div id="bookingSummary"></div></aside></div></div></main><div id="siteFooter"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/script.js"></script></body></html>
